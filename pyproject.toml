[project]
name = "f1-points-predictor"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastf1>=3.8.3",
    "mlflow>=3.17.1",
    "pandas>=2.3.3",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]